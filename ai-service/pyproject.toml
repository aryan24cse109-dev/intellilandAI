[project]
name = "intelliland-ai-service"
version = "1.0.0"
description = "AI service for IntelliLandAI land record digitization"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "numpy",
    "opencv-python",
    "pymupdf",
    "scikit-image",
    "deskew",
    "langchain",
    "langchain-community",
    "langchain-google-genai",
    "paddleocr",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"